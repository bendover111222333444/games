<html>

      <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1 on 1 Soccer | Seraph</title>
    <link rel="shortcut icon" href="../images/ico.ico" type="image/x-icon">
    <script src="../storage/js/cloak.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
      }
    </style>
  <script src="../storage/js/data.js"></script>
</head>
  <body>
    <script src="/js/main.js"></script>
    <script>
      function loadLocalRuffle() {
          var script = document.createElement('script');
          script.src = '../storage/ruffle/ruffle.js';
          document.body.appendChild(script);
      }

      var cdnScript = document.createElement('script');
      cdnScript.src = 'https://unpkg.com/@ruffle-rs/ruffle';
      cdnScript.onerror = loadLocalRuffle;
      document.body.appendChild(cdnScript);
    </script>

    <div id="ruffle" width="100%" height="100%"></div>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("1on1-soccer.swf");
      });
    </script>
  <div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;">
    <button onclick="exportData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Export Saves</button>
    <button onclick="importData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Import Saves</button>
    <button onclick="infoData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Import Blocked</button>
</div>
</body>
</html>
