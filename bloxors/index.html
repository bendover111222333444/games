<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Bloxors</title>
    <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        publicPath: undefined,
        polyfills: true,
        autoplay: "auto",
        unmuteOverlay: "visible",
        backgroundColor: "black",
        letterbox: "fullscreen",
        warnOnUnsupportedContent: true,
        contextMenu: true,
        showSwfDownload: false,
        upgradeToHttps: window.location.protocol === "https:",
        maxExecutionDuration: { secs: 15, nanos: 0 },
        logLevel: "error",
        base: null,
        menu: true,
        salign: "",
        scale: "showAll",
        quality: "high",
      };
    </script>
  <script src="../storage/js/data.js"></script>
</head>
  <body style="background-color: black">
    <center>
      <img src="title.png" style="padding: 5px; width: 300px" />
      <div
        id="container"
        style="border: #ccc 3px solid; height: 600px; width: 937px"
      ></div>
      <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
          const ruffle = window.RufflePlayer.newest();
          const player = ruffle.createPlayer();
          const container = document.getElementById("container");
          container.appendChild(player);
          player.style.height = "600px";
          player.style.width = "937px";
          player.load("bloxors.swf");
        });
      </script>
      <script src="ruffle/ruffle.js"></script>
      <script src="/js/main.js"></script>
    </center>
  <div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;">
    <button onclick="exportData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Export Saves</button>
    <button onclick="importData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Import Saves</button>
    <button onclick="infoData()" style="background-color: #2a2a2a; color: white; border: 3px; border-radius: 10px; padding: 16px; text-align: center; font-size: 17px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 8px;">Import Blocked</button>
</div>
</body>
</html>
